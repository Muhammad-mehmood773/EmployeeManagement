<nz-ribbon class="shadow" nzText="Emergency Contacts" nzColor="#000080"
    nzPlacement="end">
    <nz-card [nzTitle]="extraTemplate" class="shadow">

     @if (emergencyContacts.length > 0) {
               @for (c of emergencyContacts; track c.name) {

        <nz-descriptions [nzTitle]="'Emergency Contact ' + c.relationship" [nzColumn]="2" nzBordered
            nzSize="small">
            <nz-descriptions-item nzTitle="Name" nzSpan="2">{{ c.name
                }}</nz-descriptions-item>
            <nz-descriptions-item nzTitle="Relationship">{{ c.relationship
                }}</nz-descriptions-item>
            <nz-descriptions-item nzTitle="Contact #">{{ c.contact
                }}</nz-descriptions-item>
            <nz-descriptions-item nzTitle="Sec. Contact #">{{ c.secondaryContact
                }}</nz-descriptions-item>
        </nz-descriptions>

        <hr class="my-3" />
        }
     } @else {
        <nz-empty
      nzNotFoundImage="https://gw.alipayobjects.com/zos/antfincdn/ZHrcdLPrvN/empty.svg"
      nzNotFoundContent="No Emergency Contact added yet"
      >
    </nz-empty>
     }

    </nz-card>
</nz-ribbon>

<ng-template #extraTemplate>
    <button nz-button nzType="dashed"
        class="d-flex align-items-center justify-content-center border-2">
        <span nz-icon nzType="edit" nzTheme="twotone"></span>
    </button>
</ng-template>
