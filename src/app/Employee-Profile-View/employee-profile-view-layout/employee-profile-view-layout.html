<nz-layout>
  <nz-content class="scrollable-content">
    <div class="card-container">
      <div nz-row nzGutter="24">
        <div nz-col
          [nzXs]="24"
          [nzSm]="24"
          [nzMd]="12"
          [nzLg]="12"
          [nzXl]="8">
          <div nz-row nzGutter="16">
            <dov nz-col
              [nzXs]="24"
              [nzSm]="24"
              [nzMd]="24"
              [nzLg]="24"
              [nzXl]="24"
              class="mb-2">
              <app-employee-profile-view-card></app-employee-profile-view-card>
            </dov>
            <div nz-col
              [nzXs]="24"
              [nzSm]="24"
              [nzMd]="24"
              [nzLg]="24"
              [nzXl]="24"
              class="mb-2">
              <app-employee-profile-view-detail-card></app-employee-profile-view-detail-card>
            </div>
            <div nz-col
              [nzXs]="24"
              [nzSm]="24"
              [nzMd]="24"
              [nzLg]="24"
              [nzXl]="24"
              class="mb-2">
              <app-employee-profile-view-personal-info-card></app-employee-profile-view-personal-info-card>
            </div>
            <div nz-col
              [nzXs]="24"
              [nzSm]="24"
              [nzMd]="24"
              [nzLg]="24"
              [nzXl]="24"
              class="mb-2">
              <app-employee-profile-view-contact-info-card></app-employee-profile-view-contact-info-card>
            </div>
          </div>
        </div>

        <div nz-col
          [nzXs]="24"
          [nzSm]="24"
          [nzMd]="24"
          [nzLg]="24"
          [nzXl]="16">

          <app-employee-profile-view-bank-details-info-card></app-employee-profile-view-bank-details-info-card>
         <div class="row mb-2"></div>
          <app-employee-profile-view-family-info-card></app-employee-profile-view-family-info-card>
         <div class="row mb-2"></div>
          <app-employee-profile-view-employee-academic-info-card></app-employee-profile-view-employee-academic-info-card>
         <div class="row mb-2"></div>
          <app-employee-view-work-experience-info-card></app-employee-view-work-experience-info-card>
         <div class="row mb-2"></div>
         <app-employee-view-skills-info-card></app-employee-view-skills-info-card>
        </div>
      </div>
    </div>
  </nz-content>
</nz-layout>
