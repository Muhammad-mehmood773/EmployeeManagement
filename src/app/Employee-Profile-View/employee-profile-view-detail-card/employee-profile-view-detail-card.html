<nz-ribbon class="shadow" nzText="Employee Details" nzColor="blue" nzPlacement="end">
  <nz-card [nzTitle]="extraTemplate" class="shadow">
    <nz-descriptions nzBordered nzTitle="Employee Details" [nzColumn]="1" nzSize="small">
      <nz-descriptions-item nzTitle="Phone">{{ employee.phone }}</nz-descriptions-item>
      <nz-descriptions-item nzTitle="Email"><a [href]="'mailto:' + employee.email">{{ employee.email }}</a></nz-descriptions-item>
      <nz-descriptions-item nzTitle="Ext">{{ employee.ext }}</nz-descriptions-item>
      <nz-descriptions-item nzTitle="Location">{{ employee.location }}</nz-descriptions-item>
      <nz-descriptions-item nzTitle="Floor no">{{ employee.floorNo }}</nz-descriptions-item>
      <nz-descriptions-item nzTitle="Seat no">{{ employee.seatNo }}</nz-descriptions-item>
      <nz-descriptions-item nzTitle="Room">{{ employee.room }}</nz-descriptions-item>
      <nz-descriptions-item nzTitle="Shift">{{ employee.shift }}</nz-descriptions-item>
    </nz-descriptions>
  </nz-card>
</nz-ribbon>

<ng-template #extraTemplate>
  <button nz-button nzType="dashed" class="d-flex align-items-center justify-content-center border-2">
    <span nz-icon nzType="edit" nzTheme="twotone"></span>
  </button>
</ng-template>
