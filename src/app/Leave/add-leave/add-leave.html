<div class="leave-container">
  <div class="header">
    <i nz-icon nzType="form" nzTheme="outline"></i>
    <span>Add New Leave Type</span>
  </div>

  <form nz-form nzLayout="vertical" class="leave-form" [formGroup]="leaveForm">

    <div class="grid-3">

      <app-form-field [form]="leaveForm" controlName="leaveTypeName" label="Leave Type Name" type="input"
        [required]="true" placeholder="Enter Name Here" icon="user" 
        [loading]="isLoading"
        >
      </app-form-field>

      <app-form-field [form]="leaveForm" controlName="leaveCode" label="Leave Code" type="input"
        placeholder="Auto Generate but editable" icon="user"
        [loading]="isLoading"
        >
      </app-form-field>


      <app-form-field [form]="leaveForm" controlName="accrualMethodId" label="Accrual Method" type="select"
        [required]="true" placeholder="Select" [options]="[
        { value: '1', label: 'Monthly' },
        { value: '2', label: 'Yearly' }
        ]"
        [loading]="isLoading"
        >
      </app-form-field>

    </div>

    <div class="grid-3">

      <app-form-field [form]="leaveForm" controlName="daysAccrued" label="Days Accrued Per Year/Period" type="input"
        [required]="true" placeholder="" icon="user"
        [loading]="isLoading"
        ></app-form-field>

      <app-form-field [form]="leaveForm" controlName="carryForwardLimit" label="Carry Forward Limit (Days)" type="input"
        [required]="false" icon="global"
        [loading]="isLoading"
        ></app-form-field>

      <app-form-field [form]="leaveForm" controlName="maxConsecutiveDays" label="Maximum Consecutive Days Allowed"
        type="input" [required]="false" icon="global"
        [loading]="isLoading"
        ></app-form-field>

    </div>

    <div class="grid-3">

      <app-form-field [form]="leaveForm" controlName="backdated" label="Can Apply Backdated" type="input"
        icon="user"
        [loading]="isLoading"
        ></app-form-field>


      <app-form-field [form]="leaveForm" controlName="encashment" label="Enable Leave Encashment" type="input"
        icon="global"
        [loading]="isLoading"
        ></app-form-field>


      <app-form-field [form]="leaveForm" controlName="informBefore" label="Inform Before (Days)" type="input"
        icon="global"
        [loading]="isLoading"
        ></app-form-field>

    </div>

    <div class="switch-row">
      <div>
        <app-form-field [form]="leaveForm" controlName="isPaidLeave" label="Is Paid Leave"
          type="switch"
          [loading]="isLoading"
          ></app-form-field>

      </div>

      <div>
        <app-form-field [form]="leaveForm" controlName="isHalfDaysAllowed" label="Half-Days Allowed"
          type="switch"
          [loading]="isLoading"
          ></app-form-field>

      </div>

      <div>
        <app-form-field [form]="leaveForm" controlName="isProofRequired" label="Proof Required"
          type="switch"
          [loading]="isLoading"
          ></app-form-field>

      </div>
    </div>

    <app-form-field [form]="leaveForm" controlName="description" label="Description" type="textarea"
      placeholder="Optional description..."
      [loading]="isLoading"
      ></app-form-field>


  </form>

  <div class="footer">
    <button nz-button nzType="default" class="cancel-btn">Cancel</button>
    <button nz-button nzType="primary" class="save-btn" (click)="save()">Save Leave Type</button>
  </div>
</div>
