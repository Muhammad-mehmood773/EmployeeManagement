<nz-card nzTitle="Employee Job Details">
    <form [formGroup]="employeeJobDetail" nz-form nzLayout="vertical">

        <div nz-row [nzGutter]="8">
    
  <!-- Department -->
                    <div nz-col [nzXs]="24" [nzSm]="12" [nzMd]="12" [nzLg]="8"
                        [nzXl]="8" [nzXXl]="8">
                        <nz-form-item>
                            <nz-form-control
                                [nzErrorTip]="getError('departmentId')">
                                <nz-form-label nzRequired
                                    nzFor="department">Department
                                </nz-form-label>
                                <nz-select nzShowSearch nzAllowClear
                                    id="department"
                                    formControlName="departmentId"
                                    name="department">
                                    <nz-option nzLabel="Jack"
                                        nzValue="jack"></nz-option>
                                    <nz-option nzLabel="Lucy"
                                        nzValue="lucy"></nz-option>
                                    <nz-option nzLabel="Tom"
                                        nzValue="tom"></nz-option>
                                </nz-select>
                            </nz-form-control>
                        </nz-form-item>
                    </div>
                    <!-- Designation -->
                    <div nz-col [nzXs]="24" [nzSm]="12" [nzMd]="12" [nzLg]="8"
                        [nzXl]="8" [nzXXl]="8">
                        <nz-form-item>
                            <nz-form-control
                                [nzErrorTip]="getError('designationId')">
                                <nz-form-label nzRequired
                                    nzFor="designation">Designation
                                </nz-form-label>
                                <nz-select nzShowSearch nzAllowClear
                                    id="designation"
                                    formControlName="designationId"
                                    name="department">
                                    <nz-option nzLabel="Jack"
                                        nzValue="jack"></nz-option>
                                    <nz-option nzLabel="Lucy"
                                        nzValue="lucy"></nz-option>
                                    <nz-option nzLabel="Tom"
                                        nzValue="tom"></nz-option>
                                </nz-select>
                            </nz-form-control>
                        </nz-form-item>
                    </div>
                    <!-- Reporting Authority -->
                    <div nz-col [nzXs]="24" [nzSm]="12" [nzMd]="12" [nzLg]="8"
                        [nzXl]="8" [nzXXl]="8">
                        <nz-form-item>
                            <nz-form-control
                                [nzErrorTip]="getError('reportingAuthorityId')">
                                <nz-form-label nzRequired
                                    nzFor="reportingAuthority">Reporting
                                    Authority
                                </nz-form-label>
                                <nz-select nzShowSearch nzAllowClear
                                    id="reportingAuthority"
                                    formControlName="reportingAuthorityId"
                                    name="reportingAuthority">
                                    <nz-option nzLabel="Jack"
                                        nzValue="jack"></nz-option>
                                    <nz-option nzLabel="Lucy"
                                        nzValue="lucy"></nz-option>
                                    <nz-option nzLabel="Tom"
                                        nzValue="tom"></nz-option>
                                </nz-select>
                            </nz-form-control>
                        </nz-form-item>
                    </div>

                      <!-- Date of Birth -->
                    <div nz-col [nzXs]="24" [nzSm]="12" [nzMd]="12" [nzLg]="8"
                        [nzXl]="8" [nzXXl]="8">
                        <nz-form-item>
                            <nz-form-label nzRequired
                                nzFor="joiningDate">Joining
                                Date</nz-form-label>
                            <nz-form-control
                                [nzErrorTip]="getError('joiningDate')"><nz-date-picker
                                    style="width: 100%;"
                                    id="joiningDate"
                                    name="joiningDate"
                                    formControlName="joiningDate"
                                    nzPlaceHolder=" "
                                    nzFormat="MMM d, yyyy">
                                </nz-date-picker>
                            </nz-form-control>
                        </nz-form-item>
                    </div>
                      <!-- Employee Type -->
                    <div nz-col [nzXs]="24" [nzSm]="12" [nzMd]="12" [nzLg]="8"
                        [nzXl]="8" [nzXXl]="8">
                        <nz-form-item>
                            <nz-form-control
                                [nzErrorTip]="getError('employeeTypeId')">
                                <nz-form-label nzRequired
                                    nzFor="employeeType">Employee Type
                                </nz-form-label>
                                <nz-select nzShowSearch nzAllowClear
                                    id="employeeType"
                                    formControlName="employeeTypeId"
                                    name="employeeType">
                                    <nz-option nzLabel="Jack"
                                        nzValue="jack"></nz-option>
                                    <nz-option nzLabel="Lucy"
                                        nzValue="lucy"></nz-option>
                                    <nz-option nzLabel="Tom"
                                        nzValue="tom"></nz-option>
                                </nz-select>
                            </nz-form-control>
                        </nz-form-item>
                    </div>

                    <!-- Shift -->
                    <div nz-col [nzXs]="24" [nzSm]="12" [nzMd]="12" [nzLg]="8"
                        [nzXl]="8" [nzXXl]="8">
                        <nz-form-item>
                            <nz-form-control
                                [nzErrorTip]="getError('shiftId')">
                                <nz-form-label nzRequired
                                    nzFor="shift">Shift
                                </nz-form-label>
                                <nz-select nzShowSearch nzAllowClear
                                    id="shift"
                                    formControlName="shiftId"
                                    name="shift">
                                    <nz-option nzLabel="Jack"
                                        nzValue="jack"></nz-option>
                                    <nz-option nzLabel="Lucy"
                                        nzValue="lucy"></nz-option>
                                    <nz-option nzLabel="Tom"
                                        nzValue="tom"></nz-option>
                                </nz-select>
                            </nz-form-control>
                        </nz-form-item>
                    </div>
                    <!-- Location  -->
                    <div nz-col [nzXs]="24" [nzSm]="12" [nzMd]="12" [nzLg]="8"
                        [nzXl]="8" [nzXXl]="8">
                        <nz-form-item>
                            <nz-form-control
                                [nzErrorTip]="getError('locationId')">
                                <nz-form-label nzRequired
                                    nzFor="location">Location
                                </nz-form-label>
                                <nz-select nzShowSearch nzAllowClear
                                    id="location"
                                    formControlName="locationId"
                                    name="location">
                                    <nz-option nzLabel="Jack"
                                        nzValue="jack"></nz-option>
                                    <nz-option nzLabel="Lucy"
                                        nzValue="lucy"></nz-option>
                                    <nz-option nzLabel="Tom"
                                        nzValue="tom"></nz-option>
                                </nz-select>
                            </nz-form-control>
                        </nz-form-item>
                    </div>

        </div>
    </form>

</nz-card>
