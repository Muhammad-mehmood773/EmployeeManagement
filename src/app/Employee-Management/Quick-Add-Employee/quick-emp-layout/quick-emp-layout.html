<nz-layout>
    <nz-header>
        <app-emp-quick-add-breadcrumb></app-emp-quick-add-breadcrumb>
    </nz-header>
    <nz-content class="scrollable-content">
        <div class="card-container">
            <div nz-row [nzGutter]="8" class="mb-2">
                <div nz-col [nzXs]="24" [nzSm]="24" [nzMd]="24" [nzLg]="8"
                    [nzXl]="8">
                    <app-quick-add-emp-info
                    (formReady)="onChildForm('empInfo', $event)"></app-quick-add-emp-info>
                </div>
                <div nz-col [nzXs]="24" [nzSm]="24" [nzMd]="24" [nzLg]="16"
                    [nzXl]="16">
                    <app-quick-add-emp-job-detail
                    (formReady)="onChildForm('jobDetail', $event)">
                </app-quick-add-emp-job-detail>
                </div>
            </div>

            <div nz-row [nzGutter]="8">
                <div nz-col [nzXs]="24" [nzSm]="24" [nzMd]="24" [nzLg]="14"
                    [nzXl]="14">
                    <app-salary-allowances-benefits  (formReady)="onChildForm('salary', $event)"></app-salary-allowances-benefits>
                </div>
                <div nz-col [nzXs]="24" [nzSm]="24" [nzMd]="24" [nzLg]="10"
                    [nzXl]="10">
                    <app-emp-access-permissions  (formReady)="onChildForm('permission', $event)"
                        [isQuickAdd]="true"></app-emp-access-permissions>
                </div>
            </div>
        </div>

        <div class="row mb-5"></div>
        <div class="row mb-5"></div>
    </nz-content>

    <nz-footer class="custom-footer">
        <div nz-row [nzGutter]="16" [nzJustify]="'end'">
            <div nz-col>
                <button nz-button nzType="primary" (click)="saveEmployee()">Save
                    Employee</button>
            </div>
        </div>
    </nz-footer>
</nz-layout>
