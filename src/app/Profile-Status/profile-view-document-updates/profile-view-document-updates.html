<nz-card [nzBodyStyle]="{'background-color': '#f1f4fa'}"
                        nzTitle="Document updates"
                        [nzBordered]="true" class="shadow">

                        <nz-table [nzShowPagination]="false"
                            [nzOuterBordered]="false"
                            [nzData]="documentUpdates"
                            (nzCurrentPageDataChange)="onCurrentPageDataChange($event)"
                            [nzBordered] nzSize="small">

                            <thead>
                                <tr>
                                    <th nzLeft
                                        [(nzChecked)]="checked"
                                        [nzIndeterminate]="indeterminate"
                                        (nzCheckedChange)="onAllChecked($event)"></th>

                                    <th>Document</th>
                                    <th>Type</th>
                                    <th>Uploaded on</th>
                                    <th class="text-center">Status</th>
                                    <th>Verified by</th>
                                    <th>Comment</th>
                                    <th class="text-center" nzRight>Action</th>
                                </tr>
                            </thead>

                            <tbody>
                                @for (row of documentUpdates; track row.id) {
                                <tr>
                                    <td nzLeft
                                        [nzChecked]="setOfCheckedId.has(row.id)"
                                        (nzCheckedChange)="onItemChecked(row.id, $event)"></td>

                                    <td>{{ row.document }}</td>
                                    <td>{{ row.type }}</td>
                                    <td>{{ row.uploadedOn }}</td>

                                    <td class="text-center">
                                        <nz-tag class="emp-status"
                                            [nzColor]="getStatusStyle(row.status).bg"
                                            [ngStyle]="{
                                                'color': getStatusStyle(row.status).color,
                                                'font-weight': '600'
                                            }">
                                            {{ row.status }}
                                        </nz-tag>
                                    </td>

                                    <td>{{ row.verifiedBy }}</td>
                                    <td>{{ row.comment }}</td>
                                    
                                 <td nzRight class="text-center">
                                        <nz-space>
                                            <button nz-button nzType="dashed" class="border-2"  
                                            nzSize="small" >
                                            <span>Download</span>
                                        </button>
                                            <button nz-button nzType="primary"  
                                            nzSize="small" >
                                            <span>Save</span>
                                        </button>
                                        <button nz-button nzType="primary"
                                            nzSize="small" nzDanger>
                                            <span>Delete</span>
                                        </button>
                                        </nz-space>
                                    </td>
                                </tr>
                                }
                            </tbody>
                        </nz-table>

                    </nz-card>
