<nz-layout>
    <nz-header>
        <app-profile-breadcrumb></app-profile-breadcrumb>
    </nz-header>
    <nz-content class="scrollable-content">
        <div class="card-container">
          <div nz-row nzGutter="8">
            <div nz-col nzSpan="15">
              <app-profile-overview></app-profile-overview>
            </div>
          </div>
        </div>
    </nz-content>

    <nz-footer class="custom-footer">
        <div nz-row [nzGutter]="16" [nzJustify]="'end'">
            <div nz-col>
                <button nz-button nzType="primary">Save
                    Employee</button>
            </div>
        </div>
    </nz-footer>
</nz-layout>
