<nz-layout>
    <nz-content class="scrollable-content">
        <div class="card-container">
            <div nz-row nzJustify="center" >
                <div nz-col nzSpan="16" class="mb-2" >
                    <nz-card 
                        [nzBordered]="true" class="shadow">
                        <div class="d-flex align-items-center gap-3">
                            <nz-avatar style="border-radius: 49% !important;"
                                [nzSize]="70"
                                [nzSrc]="employee.image">
                            </nz-avatar>
                            <div class="w-100 d-flex justify-content-between">
                                <div>
                                    <div><strong>Employee Name :</strong> {{
                                        employee.name }}</div>
                                    <div><strong>Employee Code :</strong> {{
                                        employee.code }}</div>
                                </div>
                                <div>
                                    <div><strong class="text-success">Submitted On :</strong> {{
                                        employee.submittedOn }}</div>
                                    <div>
                                        <strong>Requested Sections :</strong>
                                        {{ employee.requestedSections.join(', ')
                                        }}
                                    </div>
                                </div>

                            </div>
                        </div>
                    </nz-card>

                </div>
                <div nz-col nzSpan="24" class="mb-2">
                    <app-profile-view-personal-information-update></app-profile-view-personal-information-update>

                </div>
                <div nz-col nzSpan="24" class="mb-2">
                   <app-profile-view-academic-infoupdates></app-profile-view-academic-infoupdates>

                </div>
                <div nz-col nzSpan="24" class="mb-2">
                    <app-profile-view-document-updates></app-profile-view-document-updates>

                </div>
            </div>
        </div>
    </nz-content>
</nz-layout>
